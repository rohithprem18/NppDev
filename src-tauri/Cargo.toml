[package]
name = "nppdev"
version = "2.0.0"
description = "NppDev - a fast, lightweight code editor for practice"
authors = ["Rohith Prem"]
license = "GPL-3.0"
repository = "https://github.com/rohithprem18/NppDev"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nppdev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5"
regex-lite = "0.1.9"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Registry", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
