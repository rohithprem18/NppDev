# Builds NppDev on Ubuntu and runs the judge tests there, so Linux keeps working.
# The .deb and AppImage it makes are kept as downloadable artifacts of the run.
name: Ubuntu build

on:
  push:
    branches: [main, migration/tauri-2]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Judge tests (C++, Java, Python, JavaScript, Rust, LeetCode-style)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 --nocapture

      - name: Build .deb and AppImage
        run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: nppdev-ubuntu
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
